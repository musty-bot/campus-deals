<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard – Campus Deals</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script type="module" src="/js/config.js"></script>
  <script type="module" src="/js/admin.js"></script>
  <style>
    .switch {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 34px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.3s;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 26px;
      width: 26px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: 0.3s;
    }
    input:checked + .slider {
      background-color: #2196F3;
    }
    input:checked + .slider:before {
      transform: translateX(26px);
    }
    .slider.round {
      border-radius: 34px;
    }
    .slider.round:before {
      border-radius: 50%;
    }
    .maintenance-card {
      margin: 24px 0;
    }
  </style>
</head>
<body>
  <header class="admin-header">
    <div class="container admin-header__inner">
      <h2>Admin Dashboard</h2>
      <nav>
        <a href="/admin/dashboard.html" class="active">Dashboard</a>
        <a href="/admin/pending.html">Pending</a>
        <a href="/admin/manage.html">Manage Posts</a>
        <button id="logout-btn">Logout</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="stats-grid">
      <div class="stat-card">
        <h3>Total Views (today)</h3>
        <p id="views-today">-</p>
      </div>
      <div class="stat-card">
        <h3>Active Listings</h3>
        <p id="active-listings">-</p>
      </div>
      <div class="stat-card">
        <h3>Pending Approval</h3>
        <p id="pending-count">-</p>
      </div>
      <div class="stat-card">
        <h3>Contact Clicks (today)</h3>
        <p id="clicks-today">-</p>
      </div>
    </section>

    <!-- Maintenance Toggle Card -->
    <section class="maintenance-card">
      <div class="stat-card" style="background: linear-gradient(135deg, #ff9f1c 0%, #ff6b6b 100%); color: white;">
        <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <span style="font-size: 2rem;">🔧</span>
            <div>
              <h3 style="color: white; margin: 0;">Maintenance Mode</h3>
              <p style="margin: 5px 0 0 0; font-size: 0.85rem; opacity: 0.9;">When enabled, visitors see a maintenance page</p>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 20px;">
            <span id="maintenance-status-text" style="font-weight: bold;">⛔ Offline</span>
            <label class="switch">
              <input type="checkbox" id="maintenance-toggle">
              <span class="slider round"></span>
            </label>
          </div>
        </div>
      </div>
    </section>

    <section class="chart-container">
      <canvas id="views-chart"></canvas>
    </section>

    <section class="top-posts">
      <h3>Top 10 Most Viewed Posts</h3>
      <div id="top-posts-list"></div>
    </section>
  </main>
</body>
</html>
